# Shared build definition for both services (one image, two roles).
x-build: &build
  context: .
  args:
    PORT: ${PORT}
    HTTPS_PORT: ${HTTPS_PORT}

services:
  server:
    build: *build
    # `expo serve` ignores the `PORT` env var, so compose interpolates the port
    # from .env into this argv (no shell):
    command: ["./node_modules/.bin/expo", "serve", "build", "--port", "${PORT}"]
    healthcheck:
      # wget busybox binary present in node:22-alpine; port interpolated from .env
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT}/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped

  caddy:
    # HTTPS edge; `BACKEND_HOST` points the Caddyfile's
    # `{$BACKEND_HOST:-localhost}` placeholder at the `server` service alias.
    build: *build
    command: ["caddy", "run", "--config", "/app/Caddyfile"]
    environment:
      BACKEND_HOST: server
    ports:
      - "${HTTPS_PORT}:${HTTPS_PORT}"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
