# Push-to-deploy for Expo Hosting via Expo Workflows: restores `.env` from the
# DOT_ENV secret, then runs the `eas` script — `eas workflow:run` packages the
# project and executes `.eas/workflows/deploy.yml` on EAS servers, where the
# build and production Hosting publish actually happen. Nothing builds locally
# or on the runner, and nothing is pushed back to the repository.
# Required repository secret (see README.md → Deployment):
# - DOT_ENV — full `.env` file contents (EXPO_TOKEN sources EAS auth locally;
#   EAS_PROJECT_ID links the project; Expo CLI loads the rest at config time)

name: Expo Hosting deployment

on:
  push:
    branches:
      - portfolio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expo-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore .env from the DOT_ENV secret
        run: printf '%s' "${{ secrets.DOT_ENV }}" > .env

      - name: Set up Node (22, matching the Docker image)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the EAS Workflow deploy pipeline (cloud build + production deploy)
        run: npm run eas
