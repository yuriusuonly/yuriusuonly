# Push-to-deploy for Expo Hosting: restores `.env` from the DOT_ENV secret and
# runs the `eas` deploy pipeline (static export, then a non-interactive
# production `eas-cli deploy` authenticated by the `EXPO_TOKEN` inside `.env`).
# Nothing is committed or pushed back to the repository, so no `[skip ci]`
# guard is required. Required repository secret (see README.md → Deployment):
# - DOT_ENV — full `.env` file contents (EXPO_PUBLIC_*, PORT, EXPO_TOKEN,
#   EAS_PROJECT_ID, ...; Expo CLI reads it during the export)

name: Expo Hosting deployment

on:
  push:
    branches:
      - portfolio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expo-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore .env from the DOT_ENV secret
        run: printf '%s' "${{ secrets.DOT_ENV }}" > .env

      - name: Set up Node (22, matching the Docker image)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export the static web build and deploy to Expo Hosting
        run: npm run eas
