# Deployment build: rebuilds the static web export and force-publishes it to the
# `deployment` branch, which is the source of the static output only — never a
# source-code branch (only `portfolio` is). Repository secrets (see
# README.md → Continuous integration):
# - GIT_AUTHOR_NAME / GIT_AUTHOR_EMAIL — commit author for the build output
# - DOT_ENV — full `.env` file contents (Expo reads `.env` during the build)
# The commit message carries `[skip ci]` so a stray future trigger cannot loop.

name: Deployment build

on:
  push:
    branches:
      - portfolio
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deployment-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore .env from the DOT_ENV secret
        run: printf '%s' "${{ secrets.DOT_ENV }}" > .env

      - name: Set up Node (22, matching the Docker image)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the static web export
        run: npm run expo:build
        env:
          # GitHub Pages serves project sites from a repository subpath, but the
          # export emits root-absolute asset links; prefix them with the repo name.
          EXPO_BASE_URL: "/${GITHUB_REPOSITORY#*/}"

      - name: Stage the static output (prerendered HTML + client assets)
        run: |
          mkdir site
          cp -a build/client/. site/
          cp build/server/index.html site/
          cp build/server/+not-found.html site/404.html

      - name: Commit the staged output as the configured author
        run: |
          git config user.name "${{ secrets.GIT_AUTHOR_NAME }}"
          git config user.email "${{ secrets.GIT_AUTHOR_EMAIL }}"
          cd site
          git init -q -b deployment
          git add -A
          git commit -q -m "(chore) $(date -u +%Y%m%dT%H%M%SZ) [skip ci]"

      - name: Force-publish to the deployment branch
        run: >
          cd site &&
          git push --force
          "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          HEAD:deployment
