# Push-to-deploy for Expo Hosting: restores `.env` from the DOT_ENV secret,
# then runs the `eas:deploy` script — the web export executes on this runner
# (GitHub Actions is free for public repositories), and `eas-cli` (via `npx`)
# uploads only the finished build/ artifact to EAS for production Hosting.
# Nothing is pushed back to the repository, and EAS runs no builds (no
# CI/CD-minute cost).
# Required repository secret (see README.md → Deployment):
# - DOT_ENV — full `.env` file contents (EAS_TOKEN sources EAS auth;
#   EAS_PROJECT_ID/EAS_PROJECT_SLUG link the project; Expo CLI loads the rest
#   at export time)

name: Expo Hosting deployment

on:
  push:
    branches:
      - portfolio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expo-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore .env from the DOT_ENV secret
        run: printf '%s' "${{ secrets.DOT_ENV }}" > .env

      - name: Set up Node (22, matching the Docker image)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export the web build and deploy it to Expo Hosting
        run: npm run eas:deploy
