# Expo Workflows pipeline: builds and publishes the web app to production
# Expo Hosting on EAS servers. Triggered from GitHub Actions (`npm run eas` →
# `eas workflow:run`), or directly by `npm run eas` locally — no build runs on
# the local machine or the GitHub runner.
#
# NOTE: keep the EAS GitHub integration disconnected while the GitHub Actions
# push-to-deploy workflow is the trigger; connecting it would double-run on
# every push.

name: Deploy

on:
  push:
    branches: ['portfolio']

jobs:
  deploy:
    type: deploy
    environment: production
    params:
      prod: true
